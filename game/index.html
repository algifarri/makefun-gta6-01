<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solace Vice — Port Solace Stories</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solace Vice: an open-world crime game in the city of Port Solace. Walk and drive with WASD, enter cars with F, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite">Solace Vice. An original open-world crime game set in Port Solace.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
